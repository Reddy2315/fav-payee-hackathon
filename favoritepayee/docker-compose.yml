version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: favoritepayee-postgres
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: favoritepayee
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d favoritepayee"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: favoritepayee-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/favoritepayee
      - SPRING_DATASOURCE_USERNAME=myuser
      - SPRING_DATASOURCE_PASSWORD=mypassword
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
